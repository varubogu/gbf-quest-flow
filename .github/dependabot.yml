# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# https://containers.dev/guide/dependabot
#
# package-ecosystem values follow the current GitHub supported-ecosystems list
# (bun for bun.lock, devcontainers for devcontainer.json, github-actions for
# workflow files). The previous npm entry is replaced by bun: this repository
# has bun.lock and no package-lock.json, and the npm ecosystem does not update
# bun.lock. CI installs with `bun install --frozen-lockfile`.

version: 2
updates:
  # package.json + bun.lock at the repository root.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      bun-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # .devcontainer/devcontainer.json (and its lockfile). GitHub docs require
  # directory "/" for the devcontainers ecosystem; Dependabot searches
  # .devcontainer/devcontainer.json from the repository root.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      devcontainers-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # .github/workflows/*.yml. GitHub docs require directory "/" for github-actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
